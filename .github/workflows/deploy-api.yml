# Deploys the API Worker to the STAGING environment, from CI.
#
# WHY FROM CI. The agent build container cannot reach api.cloudflare.com — the environment's network
# policy answers 403 to the CONNECT — so `wrangler deploy` cannot run there whatever token it holds.
# A GitHub runner reaches it. Same reason the migrations moved here (docs/Deployment_Runbook.md §0).
#
# SECRETS: CLOUDFLARE_API_TOKEN (Workers Scripts Edit + HYPERDRIVE EDIT — the "Edit Cloudflare
# Workers" template does NOT include Hyperdrive, and HYPERDRIVE is the only binding this Worker has)
# and SUPABASE_DB_URL (the session pooler URL; Hyperdrive stores it as the origin).
#
# RUN db-migrate.yml FIRST. A Worker pointed at an empty database answers errors that look like code
# faults and are not.
name: Deploy API

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which Worker environment to deploy'
        type: choice
        required: true
        default: testbed
        options: [testbed, staging]
      confirm:
        description: 'Type DEPLOY to confirm'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-api-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_PROJECT_REF: uroolgscjkbpcsioqogm
      ENV_NAME: ${{ inputs.environment }}
    steps:
      - name: Refuse unless confirmed
        if: inputs.confirm != 'DEPLOY'
        run: echo "::error::Type DEPLOY to confirm." && exit 1

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Create the Hyperdrive config if it does not exist, and capture its id
        id: hyperdrive
        working-directory: apps/api
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_DB_URL:-}" ] || { echo "::error::SUPABASE_DB_URL not set"; exit 1; }
          name=pencillift-${ENV_NAME}-db
          # `hyperdrive list` prints a table; ask for JSON so the id is parsed rather than scraped.
          existing=$(npx wrangler hyperdrive list --json 2>/dev/null \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print(next((c['id'] for c in d if c.get('name')=='$name'),''))" \
            || echo "")
          if [ -z "$existing" ]; then
            echo "creating Hyperdrive config $name"
            existing=$(npx wrangler hyperdrive create "$name" \
              --connection-string="$SUPABASE_DB_URL" --json \
              | python3 -c "import json,sys;print(json.load(sys.stdin)['id'])")
          else
            echo "reusing existing Hyperdrive config $name"
          fi
          [ -n "$existing" ] || { echo "::error::could not determine a Hyperdrive id"; exit 1; }
          echo "id=$existing" >> "$GITHUB_OUTPUT"
          echo "Hyperdrive id: $existing"

      - name: Point this environment's binding at that config
        working-directory: apps/api
        run: |
          set -euo pipefail
          # Substituted at deploy time rather than committed, because the placeholder in
          # wrangler.toml is deliberate: it makes a deploy fail closed rather than silently point at
          # an invented database. The id is not a secret; once staging settles, commit it and delete
          # this step so the repository and the deployed configuration agree.
          upper=$(echo "$ENV_NAME" | tr a-z A-Z)
          sed -i "s|OWNER_ACTION_HYPERDRIVE_ID_${upper}|${{ steps.hyperdrive.outputs.id }}|" wrangler.toml
          # Printed for the environment BEING DEPLOYED. This grep used to name env.staging whatever
          # was selected, so a testbed run printed an untouched staging block and looked like the
          # substitution had silently failed.
          grep -A2 "\[\[env.${ENV_NAME}.hyperdrive\]\]" wrangler.toml
          if grep -q "OWNER_ACTION_HYPERDRIVE_ID_${upper}" wrangler.toml; then
            echo "::error::the ${ENV_NAME} Hyperdrive placeholder was not substituted"; exit 1
          fi

      # DEPLOY FIRST, THEN SET SECRETS, THEN DEPLOY AGAIN — and the order is the point.
      # `wrangler secret put` against a Worker that does not exist yet prompts to create one, which
      # in a non-interactive runner fails the job. On a first-ever deploy to a fresh account that is
      # EVERY run, so the original order (secrets, then deploy) could never have completed once.
      # The first deploy creates the Worker; it answers 503 NOT_CONFIGURED for the few seconds
      # before the secrets land, which is `loadConfig` refusing to start without them, not a fault.
      - name: Deploy (creates the Worker if this is the first time)
        working-directory: apps/api
        run: npx wrangler deploy --env "$ENV_NAME"

      - name: Token verification settings (public values, derived from the project ref)
        working-directory: apps/api
        run: |
          set -euo pipefail
          # Neither is a secret: the JWKS endpoint is public by design and the issuer is a URL.
          # They are set as secrets rather than vars only so that rotating the project ref needs no
          # commit. They are NOT, on their own, enough to start the Worker — see the next step.
          npx wrangler secret put SUPABASE_JWKS_URL --env "$ENV_NAME" <<< \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1/.well-known/jwks.json"
          npx wrangler secret put SUPABASE_JWT_ISSUER --env "$ENV_NAME" <<< \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1"

      # THE TWO SECRETS THE WORKER CANNOT START WITHOUT, and that nothing used to set.
      #
      # `loadConfig` requires CHILD_TOKEN_SECRET and HASH_PEPPER as secrets of at least 32
      # characters (apps/api/src/config.ts, `secretBytes`). Neither is in wrangler.toml and neither
      # was set here, so the Worker this workflow deployed answered 503 NOT_CONFIGURED on EVERY
      # path — `/health` included — and the probe step below cheerfully called that "the testbed
      # answering". Found by an adversarial verification pass, not by a test; the test that would
      # have caught it is now apps/api/tests/deploy-secrets.test.ts.
      #
      # THEY MUST NOT CHANGE BETWEEN DEPLOYS. HASH_PEPPER is mixed into stored hashes (pairing
      # codes, PINs); rotating it silently invalidates every one of them, and the failures look like
      # a parent typing their own PIN wrongly. So: an explicit repository secret wins if one exists;
      # otherwise a value already on the Worker is LEFT ALONE; only when neither is true is one
      # generated. If `secret list` cannot be read, the job stops rather than risk generating over a
      # live pepper.
      - name: Signing secrets (generated once, then never touched again)
        working-directory: apps/api
        env:
          OWNER_CHILD_TOKEN_SECRET: ${{ secrets.CHILD_TOKEN_SECRET }}
          OWNER_HASH_PEPPER: ${{ secrets.HASH_PEPPER }}
        run: |
          set -euo pipefail
          if ! existing=$(npx wrangler secret list --env "$ENV_NAME" --format json 2>/dev/null); then
            echo "::error::could not read the Worker's secret list; refusing to guess whether a pepper exists"
            exit 1
          fi
          # Matched on the JSON text rather than parsed, so no interpreter is spawned inside a
          # YAML block scalar — a multi-line script there silently breaks the workflow file.
          have() { printf '%s' "$existing" | grep -q "\"name\"[[:space:]]*:[[:space:]]*\"$1\""; }
          set_secret() {
            name=$1; supplied=$2
            if [ -n "$supplied" ]; then
              echo "$name: using the repository secret"
              npx wrangler secret put "$name" --env "$ENV_NAME" <<< "$supplied"
            elif have "$name"; then
              echo "$name: already on the Worker, left unchanged"
            else
              echo "$name: generating one (first deploy of this environment)"
              npx wrangler secret put "$name" --env "$ENV_NAME" <<< "$(openssl rand -hex 32)"
            fi
          }
          set_secret CHILD_TOKEN_SECRET "${OWNER_CHILD_TOKEN_SECRET:-}"
          set_secret HASH_PEPPER "${OWNER_HASH_PEPPER:-}"

      - name: Deploy again, now with the token settings in place
        id: redeploy
        working-directory: apps/api
        run: |
          set -euo pipefail
          npx wrangler deploy --env "$ENV_NAME" | tee /tmp/deploy.log
          # The URL comes from wrangler's OWN output. It used to be assembled from
          # `wrangler whoami`, which does not print the workers.dev subdomain at all, so the fallback
          # branch ran every time and the job printed https://pencillift-api-<env>.workers.dev — an
          # address that does not exist. A wrong URL in the log is worse than none: it is the URL
          # somebody then pastes into the portal deploy.
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1 || true)
          if [ -z "$url" ]; then
            echo "::warning::wrangler printed no workers.dev URL; read the deploy output above."
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Prove it answers, and say what it reports about itself
        run: |
          url="${{ steps.redeploy.outputs.url }}"
          if [ -z "$url" ]; then echo "no URL to probe"; exit 0; fi
          echo "======================================================================"
          echo "$ENV_NAME API: $url"
          echo "Paste this into the 'Deploy portal' workflow's api_base_url input."
          echo "======================================================================"
          if [ "$ENV_NAME" = staging ]; then
            echo "On staging a 503 NOT_CONFIGURED is the gate working, not a failure: the Worker"
            echo "refuses mock consent, mock billing, mock AI and missing ZDR evidence."
          else
            echo "On the testbed every labeled mock is active, so this should answer rather than"
            echo "refuse. NO REAL CHILD'S WORK MAY GO HERE: the consent mock verifies anything."
          fi
          code=$(curl -sS -o /tmp/health -w '%{http_code}' --max-time 20 "$url/health" || echo 000)
          echo "GET /health  HTTP $code"
          head -c 400 /tmp/health || true
          echo
          # A 503 NOT_CONFIGURED on the TESTBED is a real failure, not the gate: every provider
          # there is a labeled mock, so the only thing that answers 503 is missing configuration.
          # Said as a check rather than as prose, because the prose used to claim the opposite.
          if [ "$ENV_NAME" = testbed ] && [ "$code" != "200" ]; then
            echo "::error::the testbed answered $code on /health — configuration is incomplete, not gated"
            exit 1
          fi
          echo
          curl -sS -o /tmp/dp -w 'GET /v1/data-practices  HTTP %{http_code}\n' --max-time 20 "$url/v1/data-practices" || true
          head -c 200 /tmp/dp || true
