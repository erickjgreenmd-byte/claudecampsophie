name: CI

on:
  pull_request:
  push:
    branches: [main, 'claude/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Secret scan
        run: node scripts/scan-secrets.mjs
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests (unit + real-Postgres authorization)
        run: pnpm test
      - name: Finance arithmetic checks
        run: pnpm finance:check
      - name: Gate audit (fails if zero tests ran)
        run: node scripts/assert-test-count.mjs
      # AC_SECURITY_04: scan what would actually ship, not only tracked files. Nothing is deployed:
      # the web portal is built, the Worker is bundled with a wrangler dry run, the app is exported
      # for web and its native-embedded public config is written, all with fake values of the
      # documented public shape in every VITE_*/EXPO_PUBLIC_* variable. A negative control then
      # plants fake secret keys in those variables and requires the scan to find them.
      - name: Build release artifacts and secret-scan them
        run: bash scripts/scan-release-artifacts.sh "$RUNNER_TEMP/release-artifacts"

  # The hosted Supabase project created 2026-10-01 runs PostgreSQL 17, while every one of the
  # authorization cases above was written and verified against PostgreSQL 16. That difference was an
  # UNTESTED ASSUMPTION the moment the project existed, and an assumption about the database that
  # holds a child's homework is not one to carry into a beta. This job is the check.
  #
  # It runs the authorization suite ONLY, not the whole verify, because the rest of the repository
  # does not touch Postgres and running it twice buys nothing. It is not allowed to fail quietly:
  # if 17 breaks a migration or changes a policy's behaviour, this is red and the hosted project is
  # the thing that must not be migrated until it is green.
  authorization-postgres-17:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Server version actually under test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$DATABASE_URL" -Atc "select version();"
      - name: Authorization suite on PostgreSQL 17
        run: pnpm --filter @pencillift/db run test
      - name: Floor still met on 17
        run: node scripts/assert-test-count.mjs
