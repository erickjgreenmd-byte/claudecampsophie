name: CI

on:
  pull_request:
  push:
    branches: [main, 'claude/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Secret scan
        run: node scripts/scan-secrets.mjs
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests (unit + real-Postgres authorization)
        run: pnpm test
      - name: Finance arithmetic checks
        run: pnpm finance:check
      - name: Gate audit (fails if zero tests ran)
        run: node scripts/assert-test-count.mjs
      # AC_SECURITY_04: scan what would actually ship, not only tracked files. Nothing is deployed:
      # the web portal is built, the Worker is bundled with a wrangler dry run, the app is exported
      # for web and its native-embedded public config is written, all with fake values of the
      # documented public shape in every VITE_*/EXPO_PUBLIC_* variable. A negative control then
      # plants fake secret keys in those variables and requires the scan to find them.
      - name: Build release artifacts and secret-scan them
        run: bash scripts/scan-release-artifacts.sh "$RUNNER_TEMP/release-artifacts"
